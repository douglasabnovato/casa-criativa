# Verificação de projeto de estudo: não publica nada
name: CI

on:
  push:
    branches: [master, 'developer/**']
  pull_request:
    branches: [master, 'developer/**']

permissions:
  contents: read

jobs:
  raiz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  # Mesmos testes no Node 24 (#51). Job à parte, e não matriz, para não mudar
  # o nome "raiz", que o ruleset da master exige.
  raiz-node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev

  interface:
    # Fluxo no navegador e axe (Playwright + Chromium), #48 e #49
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
