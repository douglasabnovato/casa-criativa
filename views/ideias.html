{% extends "layout.html" %}

{% set bodyId = "page-ideas" %}

{% block title %}
    <title>Ideias - Casa Criativa</title>
{% endblock title %}

{% block content %}
    <header>
        <a href="/"><img src="/img/logo.png" alt="Casa Criativa — início" width="150"></a>
        <nav aria-label="Principal">
            <ul>
                <li><a href="/">Início</a></li>
                <li><button type="button" class="button" data-open-modal aria-haspopup="dialog">Nova ideia</button></li>
            </ul>
        </nav>
    </header>
    <section id="title">
        <p>em exibição</p>
        <h1>Ideias</h1>
    </section>
    <main id="conteudo">
        <section id="ideas" aria-labelledby="title">
            {% include "idea-list.html" %}
        </section>
    </main>
    <footer id="footer">
        Com ❤ <a href="https://github.com/douglasabnovato" target="_blank" rel="noopener noreferrer">@douglasabnovato</a>
    </footer>
{% endblock content %}
