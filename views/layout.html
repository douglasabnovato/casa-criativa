<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Casa Criativa: catálogo colaborativo de ideias de atividades para fazer em casa.">
        <link rel="icon" href="/img/logo.png">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css">
        {% block title %}
            <title>Casa Criativa</title>
        {% endblock title %}
    </head>
    <body id="{{ bodyId }}">
        <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
        <div id="container">
            {% if created %}
                <p class="flash" role="status">Ideia cadastrada. Obrigado por contribuir!</p>
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>

        {% include "modal.html" %}

        <script src="/script.js"></script>
    </body>
</html>
